<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的回忆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #faf7f2; color: #333; line-height: 1.7; }
  header { text-align: center; padding: 72px 20px 48px; }
  header h1 { font-size: 34px; letter-spacing: 4px; margin-bottom: 10px; }
  header p { color: #999; font-size: 15px; }
  main { max-width: 860px; margin: 0 auto; padding: 0 20px 64px; }
  section { background: #fff; border-radius: 16px; padding: 28px 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  section h2 { font-size: 20px; margin-bottom: 8px; }
  section p { color: #666; font-size: 15px; }
  .tag { display: inline-block; font-size: 13px; color: #b08d57; background: #f7efe3; border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  footer { text-align: center; color: #bbb; font-size: 13px; padding-bottom: 40px; letter-spacing: 2px; }
</style>
</head>
<body>
  <header>
    <h1>我们的回忆</h1>
    <p>只属于我们两个人的地方 · 正在慢慢写</p>
  </header>
  <main>
    <section>
      <span class="tag">第一章 · 预告</span>
      <h2>第一次来西安</h2>
      <p>2024 年 10 月 7 日 · 西安大清真寺一带。照片和故事正在整理，稍后见。</p>
    </section>
    <section>
      <span class="tag">照片墙</span>
      <h2>照片</h2>
      <p>照片正在整理中，后续更新。</p>
    </section>
    <section>
      <span class="tag">攻略</span>
      <h2>旅行攻略</h2>
      <p>走过的地方、吃过的店、踩过的坑，攻略后续更新。</p>
    </section>
  </main>
  <footer>未 完 待 续</footer>
</body>
</html>
